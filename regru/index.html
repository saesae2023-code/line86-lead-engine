<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LINE 86 Lead Desk</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color-scheme:light dark}
    *{box-sizing:border-box}
    body{margin:0;background:var(--tg-theme-bg-color,#f5f5f5);color:var(--tg-theme-text-color,#111)}
    .wrap{max-width:760px;margin:0 auto;padding:16px 14px 28px}
    .head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
    h1{font-size:23px;margin:0}.sub{font-size:13px;color:var(--tg-theme-hint-color,#777);margin-top:4px}
    .filters{display:flex;gap:8px;overflow:auto;padding-bottom:4px;margin-bottom:12px}
    .filter{border:0;border-radius:999px;padding:9px 12px;background:var(--tg-theme-secondary-bg-color,#e9e9e9);color:var(--tg-theme-text-color,#111);white-space:nowrap}
    .filter.active{background:var(--tg-theme-button-color,#2481cc);color:var(--tg-theme-button-text-color,#fff)}
    .lead{background:var(--tg-theme-secondary-bg-color,#fff);border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 1px 3px rgba(0,0,0,.07)}
    .top{display:flex;justify-content:space-between;gap:12px}.company{font-weight:750;font-size:17px}.score{font-weight:800;white-space:nowrap}
    .meta,.source,.owner{font-size:13px;color:var(--tg-theme-hint-color,#777);margin-top:6px}.reason{font-size:14px;line-height:1.42;margin-top:9px}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.actions button{border:0;border-radius:11px;padding:11px 9px;font-weight:650;background:var(--tg-theme-secondary-bg-color,#eee);color:var(--tg-theme-text-color,#111)}
    .actions button.primary{background:var(--tg-theme-button-color,#2481cc);color:var(--tg-theme-button-text-color,#fff)}
    .status{display:inline-block;margin-top:10px;font-size:12px;padding:6px 9px;border-radius:999px;background:rgba(127,127,127,.15)}
    .empty{padding:38px 0;text-align:center;color:var(--tg-theme-hint-color,#777)}
  </style>
</head>
<body>
<div class="wrap">
  <div class="head"><div><h1>LINE 86 Lead Desk</h1><div class="sub" id="subtitle">Загрузка…</div></div></div>
  <div class="filters" id="filters"></div>
  <div id="leads"></div>
</div>
<script>
const tg=window.Telegram?.WebApp; if(tg){tg.ready();tg.expand();}
const initData=tg?.initData||'';
let all=[]; let current='ALL';
const statuses={NEW:'Новый',TAKEN:'В работе',CONTACT:'Связаться',LATER:'Отложен',REJECTED:'Отклонён'};
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
async function api(action,body){const r=await fetch('api.php?action='+encodeURIComponent(action),{method:body?'POST':'GET',headers:{'Content-Type':'application/json','X-Telegram-Init-Data':initData},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw new Error(d.error||'Ошибка API');return d;}
function renderFilters(){const vals=['ALL','NEW','TAKEN','CONTACT','LATER','REJECTED'];document.getElementById('filters').innerHTML=vals.map(s=>`<button class="filter ${current===s?'active':''}" onclick="setFilter('${s}')">${s==='ALL'?'Все':statuses[s]}</button>`).join('');}
function setFilter(s){current=s;renderFilters();render();}
function render(){const list=current==='ALL'?all:all.filter(x=>x.status===current);document.getElementById('subtitle').textContent=`Лидов: ${all.length} · показано: ${list.length}`;const root=document.getElementById('leads');if(!list.length){root.innerHTML='<div class="empty">Лидов в этом разделе пока нет.</div>';return;}root.innerHTML=list.map(l=>`<div class="lead"><div class="top"><div><div class="company">${esc(l.companyName)}</div><div class="meta">${esc(l.industry||'')}${l.city?' · '+esc(l.city):''}</div></div><div class="score">${Number(l.score||0)}/100</div></div>${l.qualificationReason?`<div class="reason">${esc(l.qualificationReason)}</div>`:''}<div class="source">Источник: ${esc(l.source||'—')}</div>${l.owner?`<div class="owner">Ответственный: ${esc(l.owner)}</div>`:''}<div class="status">${statuses[l.status]||esc(l.status)}</div><div class="actions"><button class="primary" onclick="act(${l.id},'TAKEN')">Взять</button><button onclick="act(${l.id},'CONTACT')">Связаться</button><button onclick="act(${l.id},'LATER')">Отложить</button><button onclick="act(${l.id},'REJECTED')">Отклонить</button></div></div>`).join('');}
async function load(){try{const d=await api('list');all=d.leads||[];renderFilters();render();}catch(e){document.getElementById('subtitle').textContent='Ошибка загрузки';document.getElementById('leads').innerHTML=`<div class="empty">${esc(e.message)}</div>`;}}
async function act(id,status){try{const d=await api('status',{id,status});const i=all.findIndex(x=>x.id===id);if(i>=0)all[i]=d.lead;tg?.HapticFeedback?.notificationOccurred('success');render();}catch(e){tg?.showAlert?.(e.message)||alert(e.message);}}
load();
</script>
</body>
</html>
